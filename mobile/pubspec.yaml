name: lightsail_mobile
description: Fully standalone Lightsail + Outline provisioner for iOS and Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  crypto: ^3.0.6
  convert: ^3.1.2
  dartssh2: ^2.12.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
