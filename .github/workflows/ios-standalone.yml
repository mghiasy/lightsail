name: iOS standalone build

# Builds the fully standalone Flutter iOS app on Apple Silicon in the cloud
# (Intel Macs often can't install current App Store Xcode).

on:
  workflow_dispatch:
  push:
    branches: [master, main, "cursor/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-standalone.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/ios-standalone.yml"

jobs:
  build-ios:
    name: Build iOS (Flutter)
    runs-on: macos-15
    timeout-minutes: 60

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods deps
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS release (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          mkdir -p ../dist-ios
          ditto -c -k --sequesterRsrc --keepParent "$APP" ../dist-ios/Lightsail-iOS-unsigned.zip
          ls -lh ../dist-ios/Lightsail-iOS-unsigned.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lightsail-iOS-unsigned
          path: dist-ios/Lightsail-iOS-unsigned.zip
          if-no-files-found: error
          retention-days: 14
