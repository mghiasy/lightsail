<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightsail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,700;1,9..40,500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="shell">
      <p class="brand">Lightsail</p>
      <h1 class="headline">Sign in to AWS</h1>
      <p class="support">
        Continue to your Amazon Web Services account portal.
      </p>
      <button type="button" class="login-btn" id="aws-login">
        Log in with AWS
      </button>
    </main>
    <script src="app.js"></script>
  </body>
</html>
